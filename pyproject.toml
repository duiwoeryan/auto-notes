[project]
name = "auto-notes"
version = "0.1.0"
description = "Auto-generate structured Markdown notes from online videos using ASR + OCR + LLM"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.0",
    "paddleocr>=2.9",
    "paddlepaddle>=3.0",
    "opencv-python>=4.9",
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "tomli>=2.0",
    "openai>=2.41.0",
    "python-dotenv>=1.2.2",
    "mlx-whisper>=0.4.3",
]

[project.scripts]
auto-notes = "auto_notes.cli:app"

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
